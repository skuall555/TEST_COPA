            X: =btnMarkerPanelBackground.X + 24
            Y: =lblMarkerTitle.Y + lblMarkerTitle.Height
      - lblMarkerMessage:
          Control: Classic/Label@2.5.1
          Properties:
            Color: =RGBA(35, 45, 60, 1)
            Height: =170
            Size: =15
            Text: =varSelectedMarker.Message
            VerticalAlign: =VerticalAlign.Top
            Visible: =varMarkerPanelVisible && !IsBlank(varSelectedMarker)
            Width: =btnMarkerPanelBackground.Width - 48
            X: =btnMarkerPanelBackground.X + 24
            Y: =lblMarkerType.Y + lblMarkerType.Height + 8
      - lblMarkerBasis:
          Control: Classic/Label@2.5.1
          Properties:
            Color: =RGBA(75, 85, 100, 1)
            Fill: =RGBA(242, 245, 248, 1)
            Height: =90
            Size: =13
            Text: ="AIが画像で見た根拠：" & varSelectedMarker.Basis
            VerticalAlign: =VerticalAlign.Top
            Visible: =varMarkerPanelVisible && !IsBlank(varSelectedMarker)
            Width: =btnMarkerPanelBackground.Width - 48
            X: =btnMarkerPanelBackground.X + 24
            Y: =btnMarkerPanelBackground.Y + btnMarkerPanelBackground.Height - 122
      - btnCloseMarkerPanel:
          Control: Classic/Button@2.2.0
          Properties:
            BorderThickness: =0
            Color: =RGBA(70, 80, 95, 1)
            Fill: =RGBA(235, 238, 243, 1)
            FontWeight: =FontWeight.Bold
            Height: =40
            OnSelect: =Set(varMarkerPanelVisible, false); Set(varSelectedMarker, Blank())
            Text: ="×"
            Visible: =varMarkerPanelVisible && !IsBlank(varSelectedMarker)
            Width: =44
            X: =btnMarkerPanelBackground.X + btnMarkerPanelBackground.Width - 56
            Y: =btnMarkerPanelBackground.Y + 12
