                                        途中欠落・取り違え・原文未取得なら当該候補の完成ROWを作らない。利用可能な別の完全な候補は残す。原文の一部のみ取得した場合はNO_HITの理由に「原文一部のみ取得」と取得範囲・不足範囲を明記し、規定不存在とは書かない。
