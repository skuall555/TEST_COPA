                                    ・複数の箇所が該当する場合は、指定された見出しに最も近いものだけを出す。

                                    # 対象
                                    文書：" & Topic.改訂選択文書一覧 & "
                                    見出し：" & Topic.改訂アンカー見出し & "
                                    この見出しに含まれる一文：" & Topic.改訂アンカー文 & "

                                    # 出力
                                    （見出しと本文を原文のまま。前置き・総括・引用番号は付けない）
                                    該当が無い場合は なし とだけ出力する。"

