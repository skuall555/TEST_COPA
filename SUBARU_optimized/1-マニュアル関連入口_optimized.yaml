                                    3. 変更対象の場所・設備・管種・口径・圧力・状態・作業目的と各文書の役割・適用範囲を比較する。
                                    4. 新規追加依頼では、その語がまだ本文に存在しなくても、同じ役割を持つ既存の列挙・条件・判断基準を持つ文書は候補にできる。
                                    5. KS25A、KS32Aなど「KS＋口径」の表記は低圧として扱う。ただしこれは文書候補の絞り込みに使う業務ルールであり、本文の記載を捏造してはいけない。
