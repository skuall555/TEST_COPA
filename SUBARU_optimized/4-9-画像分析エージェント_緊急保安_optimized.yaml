                  actions:
                    - kind: SetVariable
                      id: setVariable_fallbackExtra
                      variable: Topic.追加情報部
                      value: =Topic.画像事実
                    - kind: SetVariable
                      id: setVariable_clearUnvalidatedPhotoDone
                      variable: Topic.措置済み部
                      value: ="・なし"
                    - kind: SetVariable
                      id: setVariable_fallbackCheck
                      variable: Topic.要確認部
                      value: ="・＜要確認＞撮影要領との照合が実行できませんでした。写真に写っている措置の実施状況は、担当者が目視で確認してください。"
            - kind: SetVariable
              id: setVariable_photoEvidence_room
              variable: Topic.写真場所室内
              value: =And(CountRows(Filter(Split(Topic.画像事実, Char(10)), StartsWith(Substitute(Substitute(Trim(Value), " ", ""), "　", ""), "・写真の場所区分："))) = 1, CountRows(Filter(Split(Topic.画像事実, Char(10)), Substitute(Substitute(Trim(Value), " ", ""), "　", "") = "・写真の場所区分：室内")) = 1)
            - kind: SetVariable
              id: setVariable_photoEvidence_common
              variable: Topic.写真場所共用部
              value: =And(CountRows(Filter(Split(Topic.画像事実, Char(10)), StartsWith(Substitute(Substitute(Trim(Value), " ", ""), "　", ""), "・写真の場所区分："))) = 1, CountRows(Filter(Split(Topic.画像事実, Char(10)), Substitute(Substitute(Trim(Value), " ", ""), "　", "") = "・写真の場所区分：屋内共用部")) = 1)
            - kind: SetVariable
              id: setVariable_photoEvidence_outside
              variable: Topic.写真場所屋外
              value: =And(CountRows(Filter(Split(Topic.画像事実, Char(10)), StartsWith(Substitute(Substitute(Trim(Value), " ", ""), "　", ""), "・写真の場所区分："))) = 1, CountRows(Filter(Split(Topic.画像事実, Char(10)), Substitute(Substitute(Trim(Value), " ", ""), "　", "") = "・写真の場所区分：屋外")) = 1)
            - kind: SetVariable
              id: setVariable_photoEvidence_neighbor
              variable: Topic.写真周辺住戸明示
              value: =And(CountRows(Filter(Split(Topic.画像事実, Char(10)), StartsWith(Substitute(Substitute(Trim(Value), " ", ""), "　", ""), "・周辺住戸の明示："))) = 1, CountRows(Filter(Split(Topic.画像事実, Char(10)), Substitute(Substitute(Trim(Value), " ", ""), "　", "") = "・周辺住戸の明示：あり")) = 1)
            - kind: SetVariable
              id: setVariable_photoEvidence_pocket
              variable: Topic.写真警報器本体
              value: =And(CountRows(Filter(Split(Topic.画像事実, Char(10)), StartsWith(Substitute(Substitute(Trim(Value), " ", ""), "　", ""), "・ポケット警報器本体："))) = 1, CountRows(Filter(Split(Topic.画像事実, Char(10)), Substitute(Substitute(Trim(Value), " ", ""), "　", "") = "・ポケット警報器本体：確認")) = 1)
            - kind: SetVariable
              id: setVariable_photoEvidence_placed
              variable: Topic.写真警報器配置
              value: =And(CountRows(Filter(Split(Topic.画像事実, Char(10)), StartsWith(Substitute(Substitute(Trim(Value), " ", ""), "　", ""), "・ポケット警報器配置："))) = 1, CountRows(Filter(Split(Topic.画像事実, Char(10)), Substitute(Substitute(Trim(Value), " ", ""), "　", "") = "・ポケット警報器配置：置かれている")) = 1)
            - kind: SetVariable
              id: setVariable_photoEvidence_pocketPosition
              variable: Topic.写真警報器位置
              value: =And(CountRows(Filter(Split(Topic.画像事実, Char(10)), StartsWith(Substitute(Substitute(Trim(Value), " ", ""), "　", ""), "・ポケット警報器位置関係："))) = 1, CountRows(Filter(Split(Topic.画像事実, Char(10)), Substitute(Substitute(Trim(Value), " ", ""), "　", "") = "・ポケット警報器位置関係：確認")) = 1)
            - kind: SetVariable
              id: setVariable_photoEvidence_sheet
              variable: Topic.写真シート本体
              value: =And(CountRows(Filter(Split(Topic.画像事実, Char(10)), StartsWith(Substitute(Substitute(Trim(Value), " ", ""), "　", ""), "・火気厳禁表示シート本体："))) = 1, CountRows(Filter(Split(Topic.画像事実, Char(10)), Substitute(Substitute(Trim(Value), " ", ""), "　", "") = "・火気厳禁表示シート本体：確認")) = 1)
            - kind: SetVariable
              id: setVariable_photoEvidence_posted
              variable: Topic.写真シート掲示
              value: =And(CountRows(Filter(Split(Topic.画像事実, Char(10)), StartsWith(Substitute(Substitute(Trim(Value), " ", ""), "　", ""), "・火気厳禁表示シート掲示："))) = 1, CountRows(Filter(Split(Topic.画像事実, Char(10)), Substitute(Substitute(Trim(Value), " ", ""), "　", "") = "・火気厳禁表示シート掲示：掲示")) = 1)
            - kind: SetVariable
              id: setVariable_photoEvidence_sheetPosition
              variable: Topic.写真シート位置
              value: =And(CountRows(Filter(Split(Topic.画像事実, Char(10)), StartsWith(Substitute(Substitute(Trim(Value), " ", ""), "　", ""), "・火気厳禁表示シート位置関係："))) = 1, CountRows(Filter(Split(Topic.画像事実, Char(10)), Substitute(Substitute(Trim(Value), " ", ""), "　", "") = "・火気厳禁表示シート位置関係：確認")) = 1)
            - kind: SetVariable
              id: setVariable_photoEvidence_detector
              variable: Topic.写真検知器本体
              value: =And(CountRows(Filter(Split(Topic.画像事実, Char(10)), StartsWith(Substitute(Substitute(Trim(Value), " ", ""), "　", ""), "・可燃性ガス検知器本体："))) = 1, CountRows(Filter(Split(Topic.画像事実, Char(10)), Substitute(Substitute(Trim(Value), " ", ""), "　", "") = "・可燃性ガス検知器本体：確認")) = 1)
            - kind: SetVariable
              id: setVariable_photoEvidence_measuring
              variable: Topic.写真測定動作
              value: =And(CountRows(Filter(Split(Topic.画像事実, Char(10)), StartsWith(Substitute(Substitute(Trim(Value), " ", ""), "　", ""), "・検知器の測定動作："))) = 1, CountRows(Filter(Split(Topic.画像事実, Char(10)), Substitute(Substitute(Trim(Value), " ", ""), "　", "") = "・検知器の測定動作：確認")) = 1)
            - kind: SetVariable
              id: setVariable_photoAuditRows
              variable: Topic.写真実施済み監査行
              value: =Filter(Split(Topic.措置済み部, Char(10)), "【写真有】" in Value)
            - kind: SetVariable
              id: setVariable_photoAuditRetired
              variable: Topic.写真実施済み監査行
              value: =Filter(Topic.写真実施済み監査行, Not("ホワイトシート" in Value) && Not("MS-018" in Value))
            - kind: SetVariable
              id: setVariable_photoAuditOriginalCount
              variable: Topic.写真実施済み元件数
              value: =CountRows(Topic.写真実施済み監査行)
            - kind: SetVariable
              id: setVariable_photoAuditSingleId
              variable: Topic.写真実施済み監査行
              value: =Filter(Topic.写真実施済み監査行, CountRows(Split(Value, "MS-")) = 2)
            - kind: SetVariable
              id: setVariable_photoAuditNoSlash
              variable: Topic.写真実施済み監査行
              value: =Filter(Topic.写真実施済み監査行, Not("/" in Value))
            - kind: SetVariable
              id: setVariable_photoAuditNoWideSlash
              variable: Topic.写真実施済み監査行
              value: =Filter(Topic.写真実施済み監査行, Not("／" in Value))
            - kind: SetVariable
              id: setVariable_photoAuditKnownIds
              variable: Topic.写真実施済み監査行
              value: =Filter(Topic.写真実施済み監査行, Or("MS-001" in Value, "MS-002" in Value, "MS-003" in Value, "MS-004" in Value, "MS-005" in Value, "MS-006" in Value, "MS-007" in Value, "MS-008" in Value, "MS-009" in Value, "MS-010" in Value, "MS-011" in Value, "MS-012" in Value, "MS-013" in Value, "MS-014" in Value, "MS-015" in Value, "MS-016" in Value, "MS-017" in Value))
            - kind: SetVariable
              id: setVariable_photoAuditMS003
              variable: Topic.写真実施済み監査行
              value: =Filter(Topic.写真実施済み監査行, Or(Not("MS-003" in Value), And(Topic.写真シート本体, Topic.写真シート掲示, Topic.写真シート位置, Topic.写真場所室内)))
            - kind: SetVariable
              id: setVariable_photoAuditMS004
              variable: Topic.写真実施済み監査行
              value: =Filter(Topic.写真実施済み監査行, Or(Not("MS-004" in Value), And(Topic.写真シート本体, Topic.写真シート掲示, Topic.写真シート位置, Topic.写真場所共用部)))
            - kind: SetVariable
              id: setVariable_photoAuditMS005
              variable: Topic.写真実施済み監査行
              value: =Filter(Topic.写真実施済み監査行, Or(Not("MS-005" in Value), And(Topic.写真シート本体, Topic.写真シート掲示, Topic.写真シート位置, Topic.写真場所屋外)))
            - kind: SetVariable
              id: setVariable_photoAuditMS007
              variable: Topic.写真実施済み監査行
              value: =Filter(Topic.写真実施済み監査行, Or(Not("MS-007" in Value), And(Topic.写真警報器本体, Topic.写真警報器配置, Topic.写真警報器位置, Topic.写真場所室内)))
            - kind: SetVariable
              id: setVariable_photoAuditMS008
              variable: Topic.写真実施済み監査行
              value: =Filter(Topic.写真実施済み監査行, Or(Not("MS-008" in Value), And(Topic.写真警報器本体, Topic.写真警報器配置, Topic.写真警報器位置, Topic.写真場所共用部)))
            - kind: SetVariable
              id: setVariable_photoAuditMS009
              variable: Topic.写真実施済み監査行
              value: =Filter(Topic.写真実施済み監査行, Or(Not("MS-009" in Value), And(Topic.写真警報器本体, Topic.写真警報器配置, Topic.写真警報器位置, Topic.写真場所屋外)))
            - kind: SetVariable
              id: setVariable_photoAuditMS011
              variable: Topic.写真実施済み監査行
              value: =Filter(Topic.写真実施済み監査行, Or(Not("MS-011" in Value), And(Topic.写真検知器本体, Topic.写真測定動作, Topic.写真場所室内)))
            - kind: SetVariable
              id: setVariable_photoAuditMS012
              variable: Topic.写真実施済み監査行
              value: =Filter(Topic.写真実施済み監査行, Or(Not("MS-012" in Value), And(Topic.写真検知器本体, Topic.写真測定動作, Topic.写真場所共用部)))
            - kind: SetVariable
              id: setVariable_photoAuditMS013
              variable: Topic.写真実施済み監査行
              value: =Filter(Topic.写真実施済み監査行, Or(Not("MS-013" in Value), And(Topic.写真検知器本体, Topic.写真測定動作, Topic.写真周辺住戸明示)))
            - kind: SetVariable
              id: setVariable_photoAuditMS014
              variable: Topic.写真実施済み監査行
              value: =Filter(Topic.写真実施済み監査行, Or(Not("MS-014" in Value), And(Topic.写真検知器本体, Topic.写真測定動作, Topic.写真場所屋外)))
            - kind: SetVariable
              id: setVariable_photoAuditDone
              variable: Topic.措置済み部
              value: =If(CountRows(Topic.写真実施済み監査行) = 0, "・なし", Concat(Topic.写真実施済み監査行, Value, Char(10)))
            - kind: SetVariable
              id: setVariable_photoRetiredExtra
              variable: Topic.追加情報部
              value: =Concat(Filter(Split(Topic.追加情報部, Char(10)), Not("ホワイトシート" in Value) && Not("MS-018" in Value)), Value, Char(10))
            - kind: SetVariable
              id: setVariable_photoRetiredCheck
              variable: Topic.要確認部
              value: =Concat(Filter(Split(Topic.要確認部, Char(10)), Not("ホワイトシート" in Value) && Not("MS-018" in Value)), Value, Char(10))
            - kind: SetVariable
              id: setVariable_photoRetiredUnknown
              variable: Topic.判定なし部
              value: =Concat(Filter(Split(Topic.判定なし部, Char(10)), Not("ホワイトシート" in Value) && Not("MS-018" in Value)), Value, Char(10))
            - kind: ConditionGroup
              id: conditionGroup_photoAuditHeld
              conditions:
                - id: conditionGroup_photoAuditHeld_item
                  condition: =Topic.写真実施済み元件数 > CountRows(Topic.写真実施済み監査行)
                  actions:
                    - kind: SetVariable
                      id: setVariable_photoAuditHoldReason
                      variable: Topic.要確認部
                      value: =Topic.要確認部 & Char(10) & "・＜要確認＞写真の機器の種類、置き方、測定動作、撮影場所と照合できない実施済み項目は保留しています。不明な条件を確認してください。"
            - kind: ConditionGroup
              id: conditionGroup_photoPocketPresencePreserved
              conditions:
                - id: conditionGroup_photoPocketPresencePreserved_item
                  condition: =And(Topic.写真警報器本体, Not("ポケット警報器" in Topic.追加情報部))
                  actions:
                    - kind: SetVariable
                      id: setVariable_photoPocketPresence
                      variable: Topic.追加情報部
                      value: =Topic.追加情報部 & Char(10) & "・画像の物体認識ではポケット警報器本体を確認しました。設置条件の適否は別に判定します。"
            - kind: SetVariable
              id: setVariable_globalDone
              variable: Global.写真措置済みテキスト
              value: =Topic.措置済み部

            - kind: SetVariable
              id: setVariable_globalCheck
              variable: Global.写真要確認テキスト
              value: =Topic.要確認部

            - kind: SetVariable
              id: setVariable_appendImageResultToGlobalHistory
              variable: Global.緊急保安追加情報履歴
              value: |-
                =Global.緊急保安追加情報履歴
                & Char(10)
                & "追加情報（画像分析・"
                & Topic.画像ファイル名
                & "）："
                & Char(10)
                & "【画像から分かる現場状況】"
                & Char(10)
                & If(Topic.追加情報部 = "", "・特記なし", Topic.追加情報部)
                & Char(10)
                & "【撮影要領に基づく実施済み措置】（写真という根拠があるため、実施済みとして扱ってください）"
                & Char(10)
                & If(Topic.措置済み部 = "", "・なし", Topic.措置済み部)
                & Char(10)
                & "【要確認】（ネクストアクションとして扱ってください）"
                & Char(10)
                & If(Topic.要確認部 = "", "・なし", Topic.要確認部)
                & If(
                    IsBlank(Topic.画像同時テキスト),
                    "",
                    Char(10) & "画像と同時に入力されたテキスト：" & Topic.画像同時テキスト
                )

            - kind: SetVariable
              id: setVariable_imageReceptionOnForNextPhoto
              variable: Global.緊急保安画像受付中
              value: =true

            - kind: SendActivity
              id: sendActivity_analysisResult
              activity: |-
                画像を分析しました（{Topic.画像ファイル名}）。

                【画像から分かる現場状況】
                {If(Topic.追加情報部 = "", "・特記なし", Topic.追加情報部)}

                【撮影要領に基づく実施済み措置】
                {If(Topic.措置済み部 = "", "・なし", Topic.措置済み部)}

                【要確認】
                {If(Topic.要確認部 = "", "・なし", Topic.要確認部)}

                {If(IsBlank(Global.緊急保安初回入力), "内容は現場情報として記録しました。", "この内容を初動措置の判定へ反映します。続けて何か一言（例：「反映」）を送ってください。別の写真を続けて送っていただいても構いません。")}

            - kind: EndDialog
              id: endDialog_afterRestartEmergency

      elseActions:
        - kind: SendActivity
          id: sendActivity_promptNotConnected
          activity: |-
            画像自体は受信できていますが、画像分析Promptがまだ接続されていません。
            「緊急保安_現場画像事実抽出」Promptノードをこのトピック内の指定位置に追加してください。

        - kind: SetVariable
          id: setVariable_imageReceptionBackOn
          variable: Global.緊急保安画像受付中
          value: =true

inputType: {}
outputType: {}