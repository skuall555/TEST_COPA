              value: =Len(Trim(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Substitute(Topic.画像事実, "■写っている物", ""), "■位置・向き・状態", ""), "■人物・動作", ""), "■文字・数値", ""), "■現場周辺の状況", ""), "■画像だけでは確認できないこと", ""), "・", ""), Char(10), ""), Char(13), "")))

            - kind: ConditionGroup
