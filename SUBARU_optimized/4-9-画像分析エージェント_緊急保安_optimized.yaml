              autoSend: false
              variable: Topic.要領照合結果
              userInput: =Topic.第2段プロンプト & Char(10) & Char(10) & "# 【撮影要領_初動措置の内容】" & Char(10) & Topic.撮影要領本文 & Char(10) & Char(10) & "# 【画像から抽出された事実】" & Char(10) & Topic.画像事実 & Char(10) & "【通報・初回報告（写真で見た事実ではない）】" & If(IsBlank(Global.緊急保安初回入力), "なし", Global.緊急保安初回入力) & Char(10) & "【追加報告履歴（現在の写真事実と区別）】" & If(IsBlank(Global.緊急保安追加情報履歴), "なし", Global.緊急保安追加情報履歴)
              additionalInstructions: |-
                この入力には、判定に必要な撮影要領の内容・画像から抽出された事実・出力形式がすべて含まれています。
                外部ナレッジを検索せず、一般知識を追加せず、入力内の情報だけで判定してください。
                入力で指定された [追加情報] [措置済み] [要確認] [判定なし] の4見出しを必ずこの順で出力し、
                それ以外（前置き・総括・引用番号・URL）は一切出力しないでください。
                撮影要領本文が空・なし・不足、該当MS-IDの条件が取得できない場合、そのIDは措置済みにしない。画像事実は追加情報へ残し、該当条件の不足を要確認へ記載する。機器が似ているだけでは機器同定済みとしない。ユーザーの同時テキストは画像で確認した事実と区別する。
                通報場所の照合に報告を使うが、ユーザー申告や過去の画像結果を現在の写真で確認済みの事実にしない。見られない過去写真を見たとせず、対象物が同一と確認できない写真は結合しない。
